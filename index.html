<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ravegoth github</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow-color: #ff0000;
        }

        body {
            background-image: url('https://ravegoth.github.io/bg.png');
            background-repeat: repeat;
            background-position: 0 -1px;
            color: white;
            font-family: 'Roboto Mono', monospace;
        }

        .content {
            width: min(1180px, 100%);
            background-image: url('https://e0.pxfuel.com/wallpapers/314/795/desktop-wallpaper-black-skull-emo-quotes-skull-skulls.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
        }

        .text-shadow-custom {
            text-shadow: 1px 1px 2px black;
        }

        .glowing {
            text-shadow: 0 0 5px var(--glow-color), 0 0 10px var(--glow-color), 0 0 20px var(--glow-color), 0 0 40px var(--glow-color), 0 0 80px var(--glow-color);
        }

        a {
            color: #71b8fe;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--glow-color);
            text-decoration: underline wavy;
        }

        .description-text {
            color: #ccc;
            text-shadow: 1px 1px 2px #000;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .project-card {
            position: relative;
            z-index: 0;
            min-width: 0;
            padding: 14px 15px;
            background: rgba(0, 0, 0, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
            transform-origin: center;
            will-change: transform;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .project-card:hover {
            z-index: 10;
            background: rgba(0, 0, 0, 0.78);
            border-color: rgba(255, 0, 0, 0.6);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
            transform: translateY(-2px) scale(1.035);
        }

        .project-name {
            display: inline-block;
            max-width: 100%;
            margin-bottom: 7px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .project-description {
            display: block;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .project-date {
            display: block;
            margin-top: 9px;
            color: #9ca3af;
            font-size: 0.78rem;
            line-height: 1.35;
        }

        @media (max-width: 959px) {
            .projects-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 599px) {
            body {
                padding: 10px !important;
            }

            .content {
                padding: 18px;
            }

            .projects-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 11px;
            }
        }
    </style>
</head>

<body class="flex flex-col justify-center items-center min-h-screen p-4">
    <div class="p-6 bg-black bg-opacity-70 rounded-lg content">
        <h1 class="text-4xl md:text-5xl font-bold text-white text-center mb-4 text-shadow-custom glowing">ravegoth - <a href="https://github.com/ravegoth/" class="text-blue-400 hover:text-red-500" target="_blank" rel="noopener noreferrer">github</a></h1>
        <h3 class="text-2xl md:text-3xl font-bold text-white text-center mb-6 text-shadow-custom glowing">list of projects</h3>
        <ul id="projects" class="projects-grid">
            <li class="text-white text-center">Loading projects...</li>
        </ul>
    </div>

    <script>
        function getProjects() {
            fetch('https://api.github.com/users/ravegoth/repos')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const projectsContainer = document.getElementById('projects');

                    if (data.length === 0) {
                        projectsContainer.innerHTML = '<li class="text-white text-center">No projects found.</li>';
                        return;
                    }

                    const projects = data.map(project => {
                        const lastModifiedDate = new Date(project.updated_at);
                        const lastModifiedFormatted = lastModifiedDate.getDate() + ' ' + lastModifiedDate.toLocaleString('default', {
                            month: 'short'
                        }) + ' ' + lastModifiedDate.getFullYear();
                        const description = project.description || 'No description provided.';

                        return `
                            <li class="project-card text-white text-shadow-custom">
                                <a href="${project.html_url}" target="_blank" rel="noopener noreferrer" class="project-name hover:text-red-500">${project.name}</a>
                                <span class="project-description description-text">${description}</span>
                                <span class="project-date">Last modified: ${lastModifiedFormatted}</span>
                            </li>
                        `;
                    });

                    projectsContainer.innerHTML = projects.join('');
                })
                .catch(error => {
                    console.error('Error fetching projects:', error);
                    document.getElementById('projects').innerHTML = '<li class="text-red-400 text-center">Failed to load projects. Please try again later.</li>';
                });
        }

        getProjects();
    </script>
</body>

</html>
